[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saltmarket"
version = "0.1.0"
description = "Monte Carlo strategy simulator and PPO agent for Saltmarket, an original island-trading board game."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "gymnasium==1.4.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "torch==2.11.0",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.170.15",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "smoke: fast checks, whole set runs in under 30 seconds",
    "slow: long-running fuzz and statistics tests",
]

[tool.coverage.run]
source = ["saltmarket"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
